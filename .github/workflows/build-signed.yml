name: "Build Signed APK"

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (bump for every new build)"
        default: "51"
      edition:
        description: "Edition to build"
        type: choice
        options: [standard, llm, both]
        default: standard
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          mkdir -p signature
          printf '%s' "$KEYSTORE_B64" | base64 -d > signature/reader-release.p12
          {
            echo "storeFile=../signature/reader-release.p12"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signature/keystore_release.properties
          test -s signature/reader-release.p12

      - name: Build
        env:
          EDITION: ${{ github.event.inputs.edition || 'standard' }}
          VERSION_CODE: ${{ github.event.inputs.version_code || '51' }}
        run: |
          set -euo pipefail
          case "$EDITION" in
            llm) TASKS="assembleLlmGithubRelease" ;;
            both) TASKS="assembleStandardGithubRelease assembleLlmGithubRelease" ;;
            *) TASKS="assembleStandardGithubRelease" ;;
          esac
          ./gradlew $TASKS --max-workers=2 --stacktrace

      - name: Show signatures
        run: |
          for f in app/build/outputs/apk/*/release/*.apk; do
            [ -f "$f" ] || continue
            echo "== $f"
            keytool -printcert -jarfile "$f" 2>/dev/null | grep -E 'Owner|SHA256' || true
            sha256sum "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: origread-signed-${{ github.run_number }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OrigRead ${{ github.ref_name }} (self-built)
          files: app/build/outputs/apk/*/release/*.apk
